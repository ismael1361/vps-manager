<!doctype html>
<html class="dark" lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VPS Manager</title>
    <meta name="theme-color" content="#0e1511" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#0e1511",
                        "surface-dim": "#0e1511",
                        "surface-bright": "#343b36",
                        "surface-container-lowest": "#09100c",
                        "surface-container-low": "#161d19",
                        "surface-container": "#1a211d",
                        "surface-container-high": "#242c27",
                        "surface-container-highest": "#2f3632",
                        "surface-variant": "#2f3632",
                        "surface-tint": "#4edea3",
                        "background": "#0e1511",
                        "on-background": "#dde4dd",
                        "on-surface": "#dde4dd",
                        "on-surface-variant": "#bbcabf",
                        "outline": "#86948a",
                        "outline-variant": "#3c4a42",
                        "primary": "#4edea3",
                        "on-primary": "#003824",
                        "primary-container": "#10b981",
                        "primary-fixed": "#6ffbbe",
                        "primary-fixed-dim": "#4edea3",
                        "on-primary-fixed": "#002113",
                        "on-primary-fixed-variant": "#005236",
                        "on-primary-container": "#00422b",
                        "inverse-primary": "#006c49",
                        "secondary": "#adc6ff",
                        "on-secondary": "#002e6a",
                        "secondary-container": "#0566d9",
                        "on-secondary-container": "#e6ecff",
                        "secondary-fixed": "#d8e2ff",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-secondary-fixed": "#001a42",
                        "on-secondary-fixed-variant": "#004395",
                        "tertiary": "#ffb3af",
                        "on-tertiary": "#650911",
                        "tertiary-container": "#fc7c78",
                        "on-tertiary-container": "#711419",
                        "tertiary-fixed": "#ffdad7",
                        "tertiary-fixed-dim": "#ffb3af",
                        "on-tertiary-fixed": "#410005",
                        "on-tertiary-fixed-variant": "#842225",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#dde4dd",
                        "inverse-on-surface": "#2b322d"

                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"

                    spacing: {
                        xs: "4px",
                        sm: "8px",
                        md: "16px",
                        lg: "24px",
                        xl: "40px",
                        unit: "4px",
                        gutter: "20px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px"
                    },
                    fontFamily: {
                        "headline-sm": ["Geist", "sans-serif"],
                        "headline-md": ["Geist", "sans-serif"],
                        "headline-lg": ["Geist", "sans-serif"],
                        "body-md": ["Geist", "sans-serif"],
                        "body-lg": ["Geist", "sans-serif"],
                        "label-caps": ["JetBrains Mono", "monospace"],
                        "code-block": ["JetBrains Mono", "monospace"]
                    },
                    fontSize: {
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "headline-lg": ["30px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }],

                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "700" }],
                        "code-block": ["13px", { lineHeight: "20px", fontWeight: "400" }]

                }
            }
        };

    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/scripts/index.js"></script>
</body>

</html>
